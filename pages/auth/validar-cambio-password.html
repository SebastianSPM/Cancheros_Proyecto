<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validar cambio de contraseña | Cancheros</title>

    <link rel="stylesheet" href="./../../styles/auth/validar-cambio-password.css">

    <link
        rel="shortcut icon"
        href="../../assets/images/logos/favicon.ico"
        type="image/x-icon"
    >
</head>

<body>

    <div class="layout">

        <section class="pitch">

            <div class="pitch-brand">
                <span class="dot"></span>
                <span>Cancha Lista</span>
            </div>

            <div class="pitch-center">

                <div class="clock">
                    🔐
                    <small>Validando tu enlace</small>
                </div>

            </div>

            <p class="pitch-copy">
                Estamos verificando tu enlace de seguridad.
                <strong>Ya casi puedes cambiar tu contraseña.</strong>
            </p>

            <svg
                class="pitch-svg"
                viewBox="0 0 200 200"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <circle
                    cx="100"
                    cy="100"
                    r="70"
                    stroke="#f2f0e9"
                    stroke-width="1.5"
                />

                <circle
                    cx="100"
                    cy="100"
                    r="3"
                    fill="#f2f0e9"
                />

                <line
                    x1="100"
                    y1="0"
                    x2="100"
                    y2="200"
                    stroke="#f2f0e9"
                    stroke-width="1"
                />
            </svg>

        </section>

        <section class="form-side">

            <div class="form-card">

                <p class="eyebrow">
                    Seguridad
                </p>

                <h1>
                    Validando enlace
                </h1>

                <p class="subtitle">
                    Estamos comprobando que tu enlace sea válido
                    y que todavía esté vigente.
                </p>

                <div class="validation-status">
                    <div class="validation-icon">
                        🔄
                    </div>

                    <p class="validation-text">
                        Estamos comprobando que tu enlace sea válido
                        y que todavía esté vigente.
                    </p>
                </div>

            </div>

        </section>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>

    <script
        type="module"
        src="../../js/auth/validar-cambio-password.js">
    </script>

</body>

</html>
