<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Cancheros</title>
  <link rel="stylesheet" href="./../styles/login_registro.css">
  <link rel="shortcut icon" href="../assets/images/logos/favicon.ico" type="image/x-icon">
</head>

<body>
  <div class="layout">

    <section class="pitch">
      <div class="pitch-brand">
        <span class="dot"></span>
        <span>Cancha Lista</span>
      </div>

      <div class="pitch-center">
        <div class="clock">45'
          <small>Estamos en el descanso</small>
        </div>
      </div>

      <p class="pitch-copy">
        No te preocupes, le pasa a cualquiera.
        <strong>Te ayudamos a volver a la cancha.</strong>
      </p>

      <svg class="pitch-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="70" stroke="#f2f0e9" stroke-width="1.5" />
        <circle cx="100" cy="100" r="3" fill="#f2f0e9" />
        <line x1="100" y1="0" x2="100" y2="200" stroke="#f2f0e9" stroke-width="1" />
      </svg>
    </section>

    <section class="form-side">
      <div class="form-card">
        <p class="eyebrow">¿Olvidaste tu contraseña?</p>
        <h1>Recupérala</h1>
        <p class="subtitle">
          Ingresa el correo con el que te registraste. Te enviaremos un enlace
          para crear una nueva contraseña.
        </p>

        <form>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
          </div>

          <button type="button" class="btn-primary">Enviar enlace de recuperación</button>
        </form>

        <div class="divider">o</div>

        <p class="switch-line">
          <a href="./inicio-sesion.html" class="link">Volver a iniciar sesión</a>
        </p>
      </div>
    </section>

  </div>
</body>

</html>
