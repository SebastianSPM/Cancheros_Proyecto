<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña · Cancha Lista</title>
<link rel="stylesheet" href="./../styles/login_registro.css">
</head>
<body>
  <div class="layout">

    <section class="pitch">
      <div class="pitch-brand">
        <span class="dot"></span>
        <span>Cancha Lista</span>
      </div>

      <div class="pitch-center">
        <div class="clock">90'+3
          <small>Ya casi vuelves al juego</small>
        </div>
      </div>

      <p class="pitch-copy">
        Último paso. <strong>Elige una contraseña segura</strong> para volver a reservar tu cancha.
      </p>

      <svg class="pitch-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="70" stroke="#f2f0e9" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="3" fill="#f2f0e9"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#f2f0e9" stroke-width="1"/>
      </svg>
    </section>

    <section class="form-side">
      <div class="form-card">
        <p class="eyebrow">Restablecer contraseña</p>
        <h1>Crea una nueva</h1>
        <p class="subtitle">Debe tener mínimo 8 caracteres, una mayúscula, un número y un carácter especial.</p>

        <form>
          <div class="field">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>

          <div class="field">
            <label for="password2">Confirmar nueva contraseña</label>
            <input type="password" id="password2" placeholder="••••••••">
          </div>

          <button type="button" class="btn-primary">Guardar nueva contraseña</button>
        </form>

        <div class="divider">o</div>

        <p class="switch-line">
          <a href="./inicio-sesion.html" class="link">Volver a iniciar sesión</a>
        </p>
      </div>
    </section>

  </div>
</body>
</html>
