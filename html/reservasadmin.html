<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../Styles/reservasadmin.css">
</head>

<body>
    <main class="container-fluid py-4">
        <section class="mb-2">

        </section>

        <div class="d-flex justify-content-end align-items-center mb-3">

            <div class="icono-administrador me-2">
                <i class="bi bi-person-fill"></i>
            </div>

            <span class="fw-semibold">
                Administrador
            </span>

        </div>



        <section class="container py-4">


            <div class="text-center mb-4">
                <h2 class="fw-bold">Reservas registradas</h2>
                <p class="text-muted mb-0">
                    Consulta y administra las reservas de las canchas.
                </p>
                <div class="container mb-4">
                    <div class="row g-3 justify-content-center mt-4">


                        <div class="col-auto">
                            <div class="card tarjeta-resumen tarjeta-total">
                                <div class="card-body text-center py-3">
                                    <i class="bi bi-calendar-check icono-resumen"></i>
                                    <h6 class="mt-2 mb-1">Total reservas</h6>
                                    <h3 class="fw-bold mb-0">24</h3>
                                </div>
                            </div>
                        </div>


                        <div class="col-auto">
                            <div class="card tarjeta-resumen tarjeta-completadas">
                                <div class="card-body text-center py-3">
                                    <i class="bi bi-check-circle icono-resumen"></i>
                                    <h6 class="mt-2 mb-1">Completadas</h6>
                                    <h3 class="fw-bold mb-0">20</h3>
                                </div>
                            </div>
                        </div>


                        <div class="col-auto">
                            <div class="card tarjeta-resumen tarjeta-canceladas">
                                <div class="card-body text-center py-3">
                                    <i class="bi bi-x-circle icono-resumen"></i>
                                    <h6 class="mt-2 mb-1">Canceladas</h6>
                                    <h3 class="fw-bold mb-0">4</h3>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <button class="btn btn-agregar-cancha d-inline-flex align-items-center mt-5 mb-2" data-bs-toggle="modal" data-bs-target="#agregarCancha">
                    <i class="bi bi-plus-circle me-3"></i>Agregar cancha</button>
            </div>

            <div class="table-responsive tabla-contenedor">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Referencia</th>
                            <th>Disponible</th>
                            <th>Descripción</th>
                            <th>Nombre cancha</th>
                            <th>Precio</th>
                            <th>Ubicación</th>
                            <th>Fotos</th>
                        </tr>
                        <tbody id="tablaReservas">
                        </tbody>
                    </thead>
                    <tbody id="tablaReservas">
                        <tr id="sinReservas">
                            <td id="mensajeSinReservas" colspan="7" class="mensaje-sin-reservas">
                                No hay reservas agregadas todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="modal fade" id="agregarCancha" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formCancha">

                    <div class="modal-header position-relative">
                        <h1 class="modal-title fs-5 w-100 text-center" id="exampleModalLabel">
                            Agregar cancha
                        </h1>
    
                        <button type="button"
                                class="btn-close position-absolute end-0 me-3"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>
                    <div class="modal-body container mt-4">
                        <div class="row mb-3">
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="" >Nombre de la cancha:</label>
                                <input id="nombreCancha" type="text" class="col-md-10 bg-light border p-2 mt-3" minlength="3" maxlength="100">
                            </div>
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="">Precio:</label>
                                <input id="precio" type="number" class="col-md-10 bg-light border p-2 mt-3" min="0">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 d-flex flex-column">
                                
                                <label>Estado:</label>
    
                                <div class="d-flex gap-3 mt-3">
    
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="disponible" id="disponibleSi" value="true">
                                        <label class="form-check-label" for="disponibleSi">
                                            Activa
                                        </label>
                                    </div>
    
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="disponible" id="disponibleNo"value="false">
                                        <label class="form-check-label" for="disponibleNo">
                                            Inactiva
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 d-flex flex-column mb-3">
                                <label for="">Fotos:</label>
                                <input id="imagenCancha" type="file" class="form-control col-md-10 bg-light border p-2 mt-3" accept="image/*" multiple>
                            </div>
                        </div>
    
                        <div class="row mb-3">
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="" >Ubicación:</label>
                                <input id="ubicacion" type="text" class="col-md-10 bg-light border p-2 mt-3">
                            </div>
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="">Descripción:</label>
                                <textarea id="descripcion" class="form-control col-md-10 bg-light border p-2 mt-3" rows="4" maxlength="300"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer m-2">
                        <button id="cerrarVentana" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./../js/scriptAmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
