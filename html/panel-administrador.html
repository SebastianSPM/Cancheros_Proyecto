<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrador | Cancheros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/panel-administrador.css">
    <link rel="shortcut icon" href="../assets/images/logos/favicon.ico" type="image/x-icon">
</head>
<body>
    <nav class="container-fluid py-3">
    
        <div class="d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center">
                
                <div class="icono-administrador me-2 mx-2">
                    <i class="bi bi-person-fill"></i>
                </div>

                <span class="fw-semibold">
                    Administrador
                </span>

            </div>

            <button type="button" id="salirbtn" class="btn btn-danger mx-3">
                Salir
            </button>

        </div>

    </nav>
    <main class="container-fluid py-4">
        <section class="container-fluid py-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Canchas registradas</h2>
                <p class="text-muted mb-0">
                    Consulta y administra las canchas.
                </p>

                <div id="resumenCanchas" class="row g-3 mt-2 mb-3 justify-content-center">

                    <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                        <div class="card resumen-card resumen-total">
                            <div class="card-body">

                                <div class="resumen-icon">
                                    <i class="bi bi-grid-3x3-gap-fill" style="font-size: 2rem;"></i>
                                </div>

                                <div>
                                    <h6>Total de canchas</h6>
                                    <h3 id="totalCanchas">0</h3>
                                </div>

                            </div>
                        </div>
                    </div>


                    <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                        <div class="card resumen-card resumen-disponibles">
                            <div class="card-body">

                                <div class="resumen-icon">
                                    <i class="bi bi-check-circle-fill" style="font-size: 2rem;"></i>
                                </div>

                                <div>
                                    <h6>Canchas disponibles</h6>
                                    <h3 id="canchasDisponibles">0</h3>
                                </div>

                            </div>
                        </div>
                    </div>


                    <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                        <div class="card resumen-card resumen-no-disponibles">
                            <div class="card-body">

                                <div class="resumen-icon">
                                    <i class="bi bi-x-circle-fill" style="font-size: 2rem;"></i></i>
                                </div>

                                <div>
                                    <h6>Canchas no disponibles</h6>
                                    <h3 id="canchasNoDisponibles">0</h3>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

                <!--<div class="d-flex flex-wrap gap-2 mb-3">

                    <input
                        type="text"
                        id="buscarCancha"
                        class="form-control"
                        placeholder="Buscar cancha..."
                    >

                    <select id="filtroTipo" class="form-select">
                        <option value="">Todos los tipos</option>
                        <option value="Fútbol 5">Fútbol 5</option>
                        <option value="Fútbol 8">Fútbol 8</option>
                        <option value="Fútbol 11">Fútbol 11</option>
                    </select>

                    <select id="filtroDisponibilidad" class="form-select">
                        <option value="">Todas</option>
                        <option value="true">Disponibles</option>
                        <option value="false">No disponibles</option>
                    </select>

                </div>-->

                <button class="btn btn-agregar-cancha d-inline-flex align-items-center mt-5 mb-2" data-bs-toggle="modal" data-bs-target="#agregarCancha">
                    <i class="bi bi-plus-circle me-3"></i>Agregar cancha
                </button>
            </div>

            <div class="table-responsive tabla-contenedor">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Referencia</th>
                            <th>Disponible</th>
                            <th>Descripción</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Precio</th>
                            <th>Ubicación</th>
                            <th>Fotos</th>
                            <th>Editar</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCanchas">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="modal fade" id="agregarCancha" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <form id="formCancha">
                    <div class="headerModal modal-header position-relative">
                        <h1 class="modal-title fs-5 w-100 text-center" id="exampleModalLabel">
                            Agregar cancha
                        </h1>
                        <button id="btnAgregarCancha"
                                type="button"
                                class="btn-close position-absolute end-0 me-3"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>
                    <div class="modal-body mt-4 ">
                        <div class="row mb-3">
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="" >Nombre de la cancha:</label>
                                <input id="nombreCancha" type="text" class="col-md-10 bg-light border p-2 mt-3" minlength="3" maxlength="100" placeholder="Cancheros">
                            </div>
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="">Precio:</label>
                                <input id="precio" type="number" class="col-md-10 bg-light border p-2 mt-3" min="0" placeholder="29000">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 d-flex flex-column">
                                
                                <label>Estado:</label>
    
                                <div class="d-flex gap-3 mt-3">
    
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="disponible" id="disponibleSi" value="true">
                                        <label class="form-check-label" for="disponibleSi">
                                            Activa
                                        </label>
                                    </div>
    
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="disponible" id="disponibleNo" value="false">
                                        <label class="form-check-label" for="disponibleNo">
                                            Inactiva
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 d-flex flex-column mb-3">

                                <label>Imágenes</label>

                                <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalImagenes"
                                        id="gestionarImagenes"
                                >

                                    <i class="bi bi-images me-2"></i>
                                    Gestionar imágenes

                                </button>

                            </div>
                        </div>
    
                        <div class="row mb-3">
    
                            <div class="col-md-6 d-flex flex-column">
                                <label for="" >Ubicación:</label>
                                <input id="ubicacion" type="text" class="col-md-10 bg-light border p-2 mt-3" placeholder="Carrera 58">
                            </div>

                            <div class="col-md-6 d-flex flex-column">
                                <label for="">Descripción:</label>
                                <textarea id="descripcion" class="form-control col-md-10 bg-light border p-2 mt-3" rows="4" maxlength="300" placeholder="Hermosa casa sintetica"></textarea>
                            </div>

                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 d-flex flex-column">
                                <label class="form-label text-black fw-bold">Tipo de Cancha</label>
                                <select id="form-select-tipo" class="form-select custom-input col-md-10 bg-light border p-2 mt-3">
                                    <option selected disabled>Modalidad</option>
                                    <option value="Fútbol 5">Fútbol 5</option>
                                    <option value="Fútbol 8">Fútbol 8</option>
                                    <option value="Fútbol 7">Fútbol 7</option>
                                    <option value="Fútbol 11">Fútbol 11</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer m-2">
                        <button id="cerrarVentana" type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn-agregar btn">Agregar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para gestionar imágenes -->
    <div class="modal fade" id="modalImagenes" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Imágenes de la cancha
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div id="imagenesContainer"
                        class="d-flex flex-wrap gap-3">

                        <label class="imagen-agregar">

                            <i class="bi bi-plus-lg"></i>

                            <span>Agregar</span>

                            <input type="file"
                                id="imagenCancha"
                                accept="image/*"
                                multiple
                                hidden>

                        </label>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cerrar
                    </button>

                    <button type="button"
                            class="btn btn-primary">
                        Guardar
                    </button>

                </div>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./../js/Administrador.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
