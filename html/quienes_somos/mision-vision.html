<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión y Visión - Cancheros </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../../styles/styleNavbar.css">
</head>

<body>
    <section id="seccion-mision-vision" class="container my-5">    
        <div class="card card-mision mb-4 shadow-sm">
            <div class="row g-0 align-items-center">
                <div class="col-md-4">
                    <img src="../../assets/images/foto-misión.png" class="img-fluid rounded-start" alt="Imagen de Misión">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Nuestra Misión</h5>
                        <p class="card-text">Simplificamos la reserva de canchas en tiempo real con una experiencia ágil, rápida y sin llamadas.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-vision mb-4 shadow-sm">
            <div class="row g-0 align-items-center">
                <div class="col-md-4 order-md-2">
                    <img src="../../assets/images/foto-visión.png" class="img-fluid rounded-end" alt="Imagen de Visión">
                </div>
                <div class="col-md-8 order-md-1">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Nuestra Visión</h5>
                        <p class="card-text">Liderar en 2026 la transformación digital del acceso a canchas deportivas en Colombia.</p>
                    </div>
                </div>
            </div>
        </div>

    </section>
</body>

</html>
