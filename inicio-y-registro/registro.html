<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro · Cancha Lista</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">

    <section class="pitch">
      <div class="pitch-brand">
        <span class="dot"></span>
        <span>Cancha Lista</span>
      </div>

      <div class="pitch-center">
        <div class="clock">90'
          <small>Únete antes del pitido final</small>
        </div>
      </div>

      <p class="pitch-copy">
        Crea tu cuenta y empieza a reservar canchas sintéticas
        <strong>de forma justa, sin favoritismos.</strong>
      </p>

      <svg class="pitch-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="70" stroke="#f2f0e9" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="3" fill="#f2f0e9"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#f2f0e9" stroke-width="1"/>
      </svg>
    </section>

    <section class="form-side">
      <div class="form-card">
        <p class="eyebrow">Únete a la cancha</p>
        <h1>Crea tu cuenta</h1>
        <p class="subtitle">Regístrate para reservar horarios y gestionar tus turnos.</p>

        <form>
          <div class="field-row">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" placeholder="Juan">
            </div>
            <div class="field">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" placeholder="Pérez">
            </div>
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
          </div>

          <div class="field">
            <label for="telefono">Número de celular</label>
            <input type="tel" id="telefono" placeholder="300 000 0000">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="password">Contraseña</label>
              <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="field">
              <label for="password2">Confirmar contraseña</label>
              <input type="password" id="password2" placeholder="••••••••">
            </div>
          </div>

          <div class="form-meta">
            <label class="checkbox">
              <input type="checkbox" id="terminos">
              Acepto los términos y condiciones
            </label>
          </div>

          <button type="button" class="btn-primary">Crear cuenta</button>
        </form>

        <div class="divider">o</div>

        <p class="switch-line">
          ¿Ya tienes cuenta? <a href="login.html" class="link">Inicia sesión</a>
        </p>
      </div>
    </section>

  </div>
</body>
</html>
