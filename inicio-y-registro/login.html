<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Cancha Lista</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">

    <section class="pitch">
      <div class="pitch-brand">
        <span class="dot"></span>
        <span>Cancha Lista</span>
      </div>

      <div class="pitch-center">
        <div class="clock">21:00
          <small>Próximo turno disponible</small>
        </div>
      </div>

      <p class="pitch-copy">
        Reserva tu cancha sintética sin depender del WhatsApp del encargado.
        <strong>El orden de llegada manda.</strong>
      </p>

      <svg class="pitch-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="70" stroke="#f2f0e9" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="3" fill="#f2f0e9"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#f2f0e9" stroke-width="1"/>
      </svg>
    </section>

    <section class="form-side">
      <div class="form-card">
        <p class="eyebrow">Bienvenido de vuelta</p>
        <h1>Inicia sesión</h1>
        <p class="subtitle">Ingresa a tu cuenta para reservar tu próximo horario.</p>

        <form>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>

          <div class="form-meta">
            <label class="checkbox">
              <input type="checkbox" id="remember">
              Recordarme
            </label>
            <a href="#" class="link">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="button" class="btn-primary">Ingresar</button>
        </form>

        <div class="divider">o</div>

        <p class="switch-line">
          ¿No tienes cuenta? <a href="registro.html" class="link">Regístrate aquí</a>
        </p>
      </div>
    </section>

  </div>
</body>
</html>
